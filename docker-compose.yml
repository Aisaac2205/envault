# Runs the images published to GHCR on every release. Pin a release with
# ENVAULT_VERSION in .env (for example 1.57.0); unset, it uses `latest`.
#   docker compose up -d
#
# `pull_policy: missing` pulls an image only when it is not on the host, so a
# restart never changes the running version. Upgrade on purpose: change
# ENVAULT_VERSION (or run `docker compose pull`), then `docker compose up -d`.
# A failed pull stops `up` with an error. There is
# no build block here on purpose: with one, a failed pull would quietly build
# this checkout under the published name. The overlays carry the build recipe
# and their own local image names:
#   docker-compose.build.yml  builds api and web from this checkout
#   docker-compose.dev.yml    dev targets with hot reload
#   docker-compose.e2e.yml    hermetic E2E stack

services:
  api:
    image: ghcr.io/aisaac2205/envault-api:${ENVAULT_VERSION:-latest}
    pull_policy: missing
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # /health pinging la DB vía TerminusModule + TypeORM.
      # Usa el módulo http nativo de Node para evitar depender
      # de curl/wget (purgados en la imagen final).
      test:
        - "CMD-SHELL"
        - "node -e \"require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  web:
    image: ghcr.io/aisaac2205/envault-web:${ENVAULT_VERSION:-latest}
    pull_policy: missing
    environment:
      # Sigue el PORT real de la API en vez de asumir 3000 si alguien
      # lo cambia en .env — ver Dockerfile ENV API_UPSTREAM default.
      API_UPSTREAM: api:${PORT:-3000}
      CSP_HEADER_NAME: ${CSP_HEADER_NAME:-Content-Security-Policy}
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      # Fail-loud: si una de estas falta en .env, `docker compose
      # up` aborta antes de arrancar Postgres en lugar de caer a
      # un default inseguro (antes había :-changeme).
      POSTGRES_DB: ${DB_NAME:?DB_NAME es obligatorio (ver .env.example)}
      POSTGRES_USER: ${DB_USER:?DB_USER es obligatorio (ver .env.example)}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD es obligatorio (ver .env.example)}
    volumes:
      - db_data:/var/lib/postgresql/data
    # NO exponer puerto al host en prod: la API se conecta vía la
    # red interna de Docker (host `db`). Para conectarte con un
    # cliente desde tu máquina usá docker-compose.dev.yml o un
    # `docker compose exec db psql`.
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory-policy noeviction --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD es obligatorio}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD}\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  db_data:
  redis_data:
