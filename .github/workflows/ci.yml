name: Release Vaultly Control

on:
  push:
    branches:
      - main
  pull_request:

# Read-only by default; release and publish-images widen it for themselves.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm run lint

  typecheck:
    name: Typecheck
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm run typecheck

  test:
    name: Test
    needs: [typecheck]
    runs-on: ubuntu-latest
    services:
      db-test-pg:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass123
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d testdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RESTORE_LEASE_TEST_DATABASE_URL: postgresql://test_user:test_pass123@localhost:5434/testdb
      AUDIT_TEST_DATABASE_URL: postgresql://test_user:test_pass123@localhost:5434/testdb
      BACKUP_LEASE_TEST_DATABASE_URL: postgresql://test_user:test_pass123@localhost:5434/testdb
      JOBS_ANALYTICS_TEST_DATABASE_URL: postgresql://test_user:test_pass123@localhost:5434/testdb
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run test
        run: pnpm run test

  build:
    name: Build
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run build
        run: pnpm run build

  audit:
    name: Production dependency audit
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm run audit:production

  release:
    name: "Semantic Release"
    needs: [build, audit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    outputs:
      published: ${{ steps.released.outputs.published }}
      version: ${{ steps.released.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # semantic-release reports nothing to later steps, but it creates the
      # release tag on HEAD in this checkout. A tag that is on HEAD after the run
      # and was not before it is the version this run released.
      - name: Record release tags on HEAD
        id: tags-before
        run: echo "tags=$(git tag --points-at HEAD --list 'v*' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Run Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release --ci

      - name: Detect the released version
        id: released
        env:
          TAGS_BEFORE: ${{ steps.tags-before.outputs.tags }}
        run: |
          new_tag=""
          for tag in $(git tag --points-at HEAD --list 'v*' | sort -V); do
            case " $TAGS_BEFORE " in
              *" $tag "*) ;;
              *) new_tag="$tag" ;;
            esac
          done
          if [ -z "$new_tag" ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "No new release: the images are not published."
            exit 0
          fi
          if ! [[ "$new_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected release tag '$new_tag'."
            exit 1
          fi
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "version=${new_tag#v}" >> "$GITHUB_OUTPUT"
          echo "Released $new_tag."

  publish-images:
    name: Publish container images
    needs: [release]
    if: needs.release.outputs.published == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-images.yml
    with:
      version: ${{ needs.release.outputs.version }}
